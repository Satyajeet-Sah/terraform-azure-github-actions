name: Terraform CD

on:
    workflow_run:
        workflows: ["Terraform CI"]
        types:
            - completed

permissions:
  id-token: write
  contents: read

jobs:
    terraform:
        #Run CD only when Terraform CI completed successfully
        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Terraform in temp VM
              uses: hashicorp/setup-terraform@v3

            - name: Azure Login
              uses: azure/login@v2
              with:
                client-id: ${{secrets.AZURE_CLIENT_ID}}   
                tenant-id: ${{secrets.AZURE_TENANT_ID}}
                subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}
              
            - name: Terraform Initialization
              run: terraform init

            - name: Terraform Apply
              env:
                TF_VAR_regions: |
                    {
                        "spain-central": {
                        "location": "${{ vars.SPAIN_LOCATION }}",
                        "vm_count": ${{ vars.SPAIN_VM_COUNT }}
                        },
                        "israel-central": {
                        "location": "${{ vars.ISRAEL_LOCATION }}",
                        "vm_count": ${{ vars.ISRAEL_VM_COUNT }}
                        },
                        "central-india": {
                        "location": "${{ vars.INDIA_LOCATION }}",
                        "vm_count": ${{ vars.INDIA_VM_COUNT }}
                        }
                    }    
            
              run: terraform apply -auto-approve

